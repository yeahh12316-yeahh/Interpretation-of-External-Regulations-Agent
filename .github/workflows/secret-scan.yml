name: Build secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-built-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build without shared credentials
        run: pnpm build
      - name: Generate deterministic benchmark artifacts
        run: pnpm benchmark
      - name: Scan every dist file, including binary assets
        run: pnpm scan:build
      - name: Scan source, build, and generated benchmark artifacts
        run: pnpm scan:secrets -- --root src --root scripts --root dist --root artifacts
